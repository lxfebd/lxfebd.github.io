 进行基础的分子动力学模拟设置，以及在跑完模拟后如何提取 RMSD 和 RMSF 数据...\"},{\"id\":\"long-test-article\",\"slug\":\"long-test-article\",\"title\":\"多靶点激酶抑制剂筛选：从虚拟到现实的漫长征途\",\"type\":\"post\",\"date\":\"2026-03-26 07:00:00\",\"cover\":\"https://bu.dusays.com/2026/03/24/69c1e38b4c370.jpg\",\"content\":\"## 第一章：引言与背景\\n\\n在现代药物研发中，计算化学已经成为不可或缺的一环。随着靶点结构的解析和算力的提升，我们不再像盲人摸象一样进行高通量筛选（HTS）。\\n\\n### 1.1 三阴性乳腺癌 (TNBC) 的困境\\n\\nTNBC 由于缺乏雌激素受体、孕激素受体和 HER2 的表达，传统的内分泌治疗和靶向治疗对其无效。\\n\\n### 1.2 STAT3 与 JAK2 的级联反应\\n\\n在这个信号通路中，JAK2 的磷酸化会激活 STAT3，进而促使肿瘤细胞增殖。如果我们能同时抑制这两个靶点，就能形成双重打击。\\n\\n## 测试用文章\"}],\"chatters\":[{\"id\":\"2026-03-25-originium-research\",\"slug\":\"2026-03-25-originium-research\",\"title\":\"源石结晶与目标蛋白结合的猜想\",\"type\":\"chatter\",\"date\":\"2026-03-25 03:00:01\",\"cover\":\"https://bu.dusays.com/2026/03/24/69c1e38b4c370.jpg\",\"content\":\"今天在跑 MolGTC 模型的图神经网络筛选时，看着那些小分子的拓扑结构，突然串台到了泰拉大陆的源石病机制。\\n\\n如果把源石（Originium）结晶过程视作一种极端暴烈的**分子自组装**行为，它在感染者体内的增殖，会不会类似于某种不可逆的激酶靶点结合？就像我们针对 STAT3 或者 JAK2 寻找抑制剂一样，罗德岛的矿石病抑制剂，本质上可能就是一种能与源石活性位点产生极强亲和力的“竞争性拮抗剂”。\\n\\n\u003e 物理规律在不同维度的宇宙中或许殊途同归。\\n\\n晚点把这周的 GROMACS 跑完，要是收敛得好，周末开两把肉鸽奖励一下自己，嘿嘿\"}],\"moments\":[{\"id\":\"moment-1777128883968\",\"slug\":\"moment-1777128883968\",\"title\":\"\",\"type\":\"moment\",\"date\":\"2026-04-25T14:54:43.968Z\",\"cover\":null,\"content\":\"终于写好了这个说说，跟之前的杂谈区分开，说说有点像朋友圈那样子的，杂谈更像是非正式的文章那样子\"},{\"id\":\"moment-1777171461214\",\"slug\":\"moment-1777171461214\",\"title\":\"\",\"type\":\"moment\",\"date\":\"2026-04-26T02:44:21.214Z\",\"cover\":null,\"content\":\"准备打包中，然后做教程，工程量好大啊，慢慢一步一步来\"},{\"id\":\"moment-1777182725435\",\"slug\":\"moment-1777182725435\",\"title\":\"\",\"type\":\"moment\",\"date\":\"2026-04-26T05:52:05.435Z\",\"cover\":null,\"content\":\"本来想做个exe来运行的，但是燃尽了打包都没有成功，可惜了，只能做一个py运行，后续出个教程如何运行，然后这个环境需要安装3.10的python才能运行。煮啵已经尽量吧流程做到最简了，燃尽了\"}]}],[[\"$\",\"link\",\"0\",{\"rel\":\"stylesheet\",\"href\":\"/_next/static/css/0f707cd0b07b2440.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}
